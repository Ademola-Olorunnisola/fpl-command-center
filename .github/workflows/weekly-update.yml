name: Weekly FPL update

on:
  schedule:
    # Runs every Tuesday at 08:00 UTC (after weekend gameweeks are done and
    # prices/fixtures are updated). Adjust the cron expression if you'd
    # rather it run a different day/time -- https://crontab.guru is handy
    # for editing this.
    - cron: '0 8 * * 2'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy lightgbm pulp requests

      - name: Run weekly pipeline
        id: pipeline
        run: |
          python scripts/weekly_pipeline.py | tee pipeline_output.log
          echo "flags=$(grep CHIP_FLAGS= pipeline_output.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        run: |
          git config user.name "fpl-bot"
          git config user.email "actions@github.com"
          git add public/data.json
          git diff --quiet --cached || git commit -m "Weekly data update $(date -u +%Y-%m-%d)"
          git push

      - name: Send notification if a chip is flagged
        if: steps.pipeline.outputs.flags != 'none' && steps.pipeline.outputs.flags != ''
        run: |
          curl -s \
            -H "Title: FPL chip recommendation" \
            -H "Priority: high" \
            -H "Tags: soccer" \
            -d "This week's model flags: ${{ steps.pipeline.outputs.flags }}. Check the app for details." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
